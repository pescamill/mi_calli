<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mi_calli Admin UI</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; padding: 1.5rem; max-width: 1100px; margin: auto; background: #f9f9f7; color: #1a1a1a; }
h1, h2, h3 { margin-top: 0; }
form { display: grid; gap: 0.75rem; margin-bottom: 1rem; max-width: 420px; }
input, select, button { padding: 0.5rem; font-size: 1rem; }
.card { border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; background: #fff; border-radius: 8px; }
.message { color: #b33; font-weight: bold; min-height: 1.5rem; margin-bottom: 0.5rem; }
.grid-wrap { overflow-x: auto; }
table.year-grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.year-grid th { padding: 6px 8px; text-align: center; font-weight: 500; color: #555; border-bottom: 1px solid #e0e0e0; }
table.year-grid td.prop-name { padding: 8px; font-weight: 500; white-space: nowrap; border-right: 1px solid #e0e0e0; }
table.year-grid td.cell { width: 52px; text-align: center; padding: 4px; }
.dot { display: inline-block; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; transition: opacity 0.15s; }
.dot:hover { opacity: 0.75; }
.dot-paid { background: #3B6D11; }
.dot-unpaid { background: #A32D2D; }
.dot-none { background: #D3D1C7; cursor: default; }
.detail-row td { padding: 0; }
.detail-panel { background: #f5f5f2; border-top: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0; padding: 1rem; }
.detail-panel table { width: 100%; font-size: 13px; border-collapse: collapse; }
.detail-panel th { text-align: left; padding: 4px 8px; color: #555; font-weight: 500; border-bottom: 1px solid #ddd; }
.detail-panel td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.badge-yes { background: #EAF3DE; color: #27500A; }
.badge-no { background: #FCEBEB; color: #791F1F; }
.legend { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; font-size: 13px; color: #555; }
.legend-dot { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
button.action-btn { font-size: 12px; padding: 4px 10px; cursor: pointer; background: #fff; border: 1px solid #bbb; border-radius: 4px; }
button.action-btn:hover { background: #f0f0f0; }
</style>
</head>
<body>
<div id="message" class="message"></div>

<section id="login-section" class="card">
  <h2>Login or Register (admin)</h2>
  <form id="login-form" style="margin-bottom:0.75rem;">
    <label for="login-select">Login as admin:</label>
    <select id="login-select"><option value="">-- choose admin --</option></select>
    <button id="login-button" type="button">Login</button>
  </form>
  <form id="register-form">
    <h3>Register new admin</h3>
    <input id="reg-username" placeholder="Admin username" required />
    <input id="reg-email" type="email" placeholder="Admin email" required />
    <input id="reg-password" type="password" placeholder="Admin password" required />
    <button type="submit">Register &amp; Enter dashboard</button>
  </form>
</section>

<section id="dashboard-section" class="card" style="display:none;">
  <h2>Admin dashboard</h2>
  <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem;">
    <div>Logged in as <strong id="current-admin-name"></strong></div>
    <button id="logout-button" type="button">Logout</button>
    <button id="refresh-button" type="button">Refresh data</button>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
    <form id="property-form" class="card" style="margin:0;">
      <h3>Create property</h3>
      <input id="property-name" placeholder="Property name" required />
      <input id="property-address" placeholder="Address" required />
      <input id="property-image" placeholder="Image URL (optional)" />
      <button type="submit">Create property</button>
    </form>

    <form id="tenant-form" class="card" style="margin:0;">
      <h3>Create tenant</h3>
      <input id="tenant-username" placeholder="Tenant username" required />
      <input id="tenant-email" type="email" placeholder="Tenant email" required />
      <button type="submit">Create tenant</button>
    </form>
  </div>

  <form id="contract-form" class="card">
    <h3>Assign tenant to property</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
      <select id="contract-tenant-select" required><option value="">-- select tenant --</option></select>
      <select id="contract-property-select" required><option value="">-- select property --</option></select>
      <input id="contract-amount" type="number" placeholder="Monthly rent amount" required />
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <label>Year <input id="contract-year" type="number" value="2026" style="width:5rem;" /></label>
        <label>Month <input id="contract-month" type="number" value="5" min="1" max="12" style="width:4rem;" /></label>
      </div>
    </div>
    <button type="submit" style="margin-top:0.5rem;">Create contract</button>
  </form>

  <div class="card">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;">
      <h3 style="margin:0;">Yearly overview</h3>
      <label style="font-size:14px;">Year <input id="overview-year" type="number" value="2026" style="width:5rem;padding:4px;" /></label>
      <button id="load-year" type="button">Load</button>
      <button id="generate-reminders" type="button">Generate reminders</button>
      <label style="font-size:14px;">Month <input id="remind-month" type="number" value="5" min="1" max="12" style="width:4rem;padding:4px;" /></label>
    </div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#3B6D11;"></span>Paid</span>
      <span><span class="legend-dot" style="background:#A32D2D;"></span>Unpaid</span>
      <span><span class="legend-dot" style="background:#D3D1C7;"></span>No contract</span>
    </div>
    <div class="grid-wrap">
      <div id="year-grid">Select a year and click Load.</div>
    </div>
  </div>

</section>

<section class="card">
  <h2>Current properties</h2>
  <div id="properties-list">Loading...</div>
</section>

<script src="app.js"></script>
</body>
</html>
