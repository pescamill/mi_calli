# Standalone test stack. Does not read backend/.env or mount application data.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: mi_calli_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d mi_calli_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://e2e:e2e@postgres:5432/mi_calli_e2e
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      GOOGLE_SHEET_ID: ""
    tmpfs:
      - /app/uploads
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --lifespan off"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://localhost:8000/health/db'))['database']=='connected'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/users"]
      interval: 2s
      timeout: 3s
      retries: 30
