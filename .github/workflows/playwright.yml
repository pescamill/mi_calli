name: Playwright
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the year summary benchmark instead of regression tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:up
      - name: Regression tests
        if: ${{ !inputs.benchmark }}
        run: npm test
      - name: Benchmark
        if: ${{ inputs.benchmark }}
        run: npm run benchmark
      - name: Container logs
        if: always()
        run: docker compose -p mi-calli-e2e -f compose.e2e.yml logs --no-color > e2e-containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            e2e-containers.log
          retention-days: 7
      - name: Stop test stack
        if: always()
        run: npm run test:down
